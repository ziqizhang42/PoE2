name: poe2

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: poe2_dev
      POSTGRES_USER: poe2_dev
      POSTGRES_PASSWORD: poe2_dev
    ports:
      # Loopback-only: a development database must not be reachable from
      # other hosts on the network the developer happens to be on.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  db-test:
    image: postgres:18
    profiles:
      - test
    environment:
      POSTGRES_DB: poe2_test
      POSTGRES_USER: poe2_test
      POSTGRES_PASSWORD: poe2_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  integration-tests:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - test
    depends_on:
      db-test:
        condition: service_healthy
    working_dir: /app
    init: true
    environment:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://poe2_test:poe2_test@db-test:5432/poe2_test
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - pnpm-store:/pnpm/store
    command: ["pnpm", "run", "test:integration"]

  tooling:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    init: true
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://poe2_dev:poe2_dev@db:5432/poe2_dev
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - pnpm-store:/pnpm/store
    command: ["sleep", "infinity"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - app
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    init: true
    environment:
      NODE_ENV: development
      HOST: "0.0.0.0"
      PORT: "3000"
      # Exactly one hop: the Vite container in the `frontend` service. Fastify
      # skips that hop and uses the address Vite appended, so a client-supplied
      # x-forwarded-for entry sent through Vite is discarded. The hop count is
      # positional, so whatever opens the socket is still trusted; the published
      # port below is loopback-only for that reason.
      TRUST_PROXY_HOPS: "1"
      # The only browser origin allowed to open /api/ws. A WebSocket upgrade
      # ignores the same-origin policy but still sends the session cookie, so
      # this list is what keeps another page from opening an authenticated
      # socket. There is no wildcard, and production must set it explicitly.
      WEBSOCKET_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      DATABASE_URL: postgresql://poe2_dev:poe2_dev@db:5432/poe2_dev
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - pnpm-store:/pnpm/store
    command: ["pnpm", "--filter", "@poe2/backend", "run", "dev"]
    healthcheck:
      test: [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1), () =>
          process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - app
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /app
    init: true
    environment:
      NODE_ENV: development
      BACKEND_ORIGIN: http://backend:3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - pnpm-store:/pnpm/store
    command: ["pnpm", "--filter", "@poe2/frontend", "run", "dev"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173').then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  node-modules:
  pnpm-store:
