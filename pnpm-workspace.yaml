packages:
  - frontend
  - backend
  - packages/*

# Keep the engine artifact as one opaque, exact package spec. For an upgrade,
# replace this value with the spec published by that release; do not infer its
# tag, host, or filename from the version number.
catalogs:
  engine:
    "@poe2/engine-wasm": https://github.com/ziqizhang42/PoE2-engine/releases/download/v0.2.0/poe2-engine-wasm-0.2.0.tgz

engineStrict: true
storeDir: /pnpm/store

# typescript@7 delegates to a platform-specific binary package. The VS Code
# native-preview extension resolves it as <tsdk>/../@typescript/<platform-pkg>,
# which only exists if that scope is hoisted to the root node_modules. Without
# this, the editor silently falls back to the compiler bundled with the
# extension instead of the version pinned in package.json.
publicHoistPattern:
  - "@typescript/*"

allowBuilds:
  esbuild: true
